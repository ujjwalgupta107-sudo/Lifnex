<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lifnexDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E54" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lifnexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="crimsonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Heart-Drop & Neural Node Emblem -->
  <g transform="translate(10, 10)">
    <!-- Ambient Pulse Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(225, 29, 72, 0.2)" stroke-width="2" stroke-dasharray="4 6" />
    
    <!-- Outer Glow Shape -->
    <path d="M50,14 C50,14 22,48 22,68 C22,83.46 34.54,96 50,96 C65.46,96 78,83.46 78,68 C78,48 50,14 50,14 Z" 
          fill="url(#lifnexDropGrad)" 
          filter="url(#crimsonPulse)" />
    
    <!-- Inner Core Bio-Geometry -->
    <path d="M50,22 C50,22 28,52 28,68 C28,80.15 37.85,90 50,90 C62.15,90 72,80.15 72,68 C72,52 50,22 50,22 Z" 
          fill="url(#lifnexDropGrad)" />

    <!-- Modern Neural Pulse Cross / Connection Node -->
    <path d="M50,42 L50,78 M32,60 L68,60" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Connected Synapse Dots (Interconnected donor nodes) -->
    <circle cx="50" cy="38" r="3.5" fill="#38BDF8" />
    <circle cx="50" cy="82" r="3.5" fill="#38BDF8" />
    <circle cx="28" cy="60" r="3.5" fill="#38BDF8" />
    <circle cx="72" cy="60" r="3.5" fill="#38BDF8" />

    <!-- Specular Highlight -->
    <ellipse cx="42" cy="48" rx="8" ry="14" fill="#FFFFFF" opacity="0.35" transform="rotate(-25 42 48)" />
  </g>

  <!-- Lifnex Modern Typographic Wordmark -->
  <g transform="translate(125, 68)">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="-1px" 
          fill="#FFFFFF">
      LIF<tspan fill="#FF2E54">NEX</tspan>
    </text>
    <text y="24" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3.5px" 
          fill="#94A3B8" 
          text-transform="uppercase">
      Emergency Neural Blood Grid
    </text>
  </g>
</svg>

