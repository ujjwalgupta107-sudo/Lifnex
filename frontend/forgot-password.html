<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Lifnex Platform</title>

  <link rel="stylesheet" href="static/css/variables.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/layout.css">
</head>
<body style="background: radial-gradient(circle at top right, rgba(254, 205, 211, 0.3), transparent 60%), var(--slate-100); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Demo Disclaimer Banner -->
  <div class="demo-banner">
    <div class="container flex justify-between items-center">
      <div class="demo-banner-text">
        <span class="demo-tag">Synthetic Demo Environment</span>
        <span>Simulated password recovery workflow.</span>
      </div>
      <a href="login.html" class="text-xs text-cyan-200 hover:underline">&larr; Back to Sign In</a>
    </div>
  </div>

  <main class="flex items-center justify-center flex-1 p-6">
    <div class="card p-8" style="max-width: 440px; width: 100%; box-shadow: var(--shadow-xl);">
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center gap-2 mb-3">
          <img src="static/assets/logo/lifnex-logo.png" alt="Lifnex Logo" style="height: 38px; width: auto; margin: 0 auto;">
        </a>
        <h2 class="text-xl font-bold text-slate-900">Reset Your Password</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your registered email to receive a password reset link</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="resetEmail" class="form-label">Registered Email Address <span class="required">*</span></label>
          <input type="email" id="resetEmail" class="form-input" placeholder="name@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary w-full py-2 mb-4">Send Recovery Link</button>

        <div class="text-center text-xs text-slate-500">
          Remembered your password? <a href="login.html" class="font-bold text-crimson-600 hover:underline">Return to Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="static/js/main.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
