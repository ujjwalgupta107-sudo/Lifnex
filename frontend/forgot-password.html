<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Lifnex Platform</title>

  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background: var(--bg-body); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Demo Disclaimer Banner -->
  <div class="demo-banner">
    <div class="container flex justify-between items-center">
      <div class="demo-banner-text">
        <span class="demo-tag">Synthetic Demo Environment</span>
        <span>Simulated password recovery workflow.</span>
      </div>
      <a href="login.html" class="text-xs text-cyan-200 hover:underline">&larr; Back to Sign In</a>
    </div>
  </div>

  <main class="flex items-center justify-center flex-1 p-6">
    <div class="card p-8" style="max-width: 440px; width: 100%; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); border: 1px solid var(--border-light);">
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center gap-2 mb-3">
          <img src="/static/assets/logo/lifnex-logo.png" alt="Lifnex Logo" style="height: 40px; width: auto; margin: 0 auto;">
        </a>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--brand-navy); margin: 0;">Reset Your Password</h2>
        <p style="font-size: 0.825rem; color: var(--text-muted); margin: 0.35rem 0 0;">Enter your registered email to receive a password reset link</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group mb-5">
          <label for="resetEmail" class="form-label" style="font-size: 0.825rem; font-weight: 600;">Registered Email Address <span class="required">*</span></label>
          <div style="position: relative;">
            <input type="email" id="resetEmail" class="form-input" placeholder="name@example.com" required style="padding-left: 2.25rem;">
            <i data-lucide="mail" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full py-2 mb-4" style="border-radius: var(--radius-md); font-weight: 600;">Send Recovery Link</button>

        <div class="text-center text-xs" style="color: var(--text-muted);">
          Remembered your password? <a href="login.html" class="font-bold hover:underline" style="color: var(--primary);">Return to Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
