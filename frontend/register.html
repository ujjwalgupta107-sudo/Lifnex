<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Lifnex Platform</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/branding/favicon.svg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(255, 46, 84, 0.08) 0%, #050811 70%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .register-box-compact {
      max-width: 440px;
      width: 100%;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 46, 84, 0.1);
      backdrop-filter: blur(20px);
    }
    .role-toggle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .role-toggle-btn {
      padding: 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--slate-400);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .role-toggle-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(255, 46, 84, 0.4);
    }
  </style>
</head>
<body>

  <!-- Floating Compact Brand Header -->
  <div style="text-align: center; margin-bottom: 1.25rem;">
    <a href="index.html" style="display: inline-block;">
      <img src="/static/assets/branding/logo.svg" alt="Lifnex Official Logo" style="height: 40px; margin: 0 auto;">
    </a>
  </div>

  <!-- Compact 440px Register Card -->
  <div class="register-box-compact">
    <div style="text-align: center; margin-bottom: 1.25rem;">
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em;">Create Account</h1>
      <p style="font-size: 0.8rem; color: var(--slate-400); margin-top: 0.2rem;">Join the Lifnex emergency donor mesh</p>
    </div>

    <!-- Role Toggle -->
    <div class="role-toggle-grid">
      <button type="button" class="role-toggle-btn active" id="btnRolePatient" onclick="selectRole('patient')">
        Patient
      </button>
      <button type="button" class="role-toggle-btn" id="btnRoleDonor" onclick="selectRole('donor')">
        Donor
      </button>
    </div>

    <form id="registrationForm">
      <input type="hidden" id="selectedRoleInput" value="patient">

      <div class="form-group" style="margin-bottom: 0.85rem;">
        <label class="form-label" style="font-size: 0.78rem;">Full Name</label>
        <input type="text" id="regFullName" class="form-control" placeholder="e.g. Rahul Sharma" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
      </div>

      <div class="form-group" style="margin-bottom: 0.85rem;">
        <label class="form-label" style="font-size: 0.78rem;">Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="rahul@example.com" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
      </div>

      <div class="form-group" style="margin-bottom: 0.85rem;">
        <label class="form-label" style="font-size: 0.78rem;">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
      </div>

      <div class="form-group" id="bloodGroupGroup" style="margin-bottom: 1.25rem; display: none;">
        <label class="form-label" style="font-size: 0.78rem;">Blood Group</label>
        <select id="regBloodGroup" class="form-control" style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+" selected>O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <button type="submit" id="btnSubmitRegister" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 0.9rem; font-weight: 700;">
        Continue / Send OTP &rarr;
      </button>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: var(--slate-400);">
        Already have an account? <a href="login.html" style="color: #FF2E54; font-weight: 700; text-decoration: none;">Sign In</a>
      </div>
    </form>
  </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    function selectRole(role) {
      document.getElementById('selectedRoleInput').value = role;
      const bgGroup = document.getElementById('bloodGroupGroup');
      if (role === 'patient') {
        document.getElementById('btnRolePatient').classList.add('active');
        document.getElementById('btnRoleDonor').classList.remove('active');
        if (bgGroup) bgGroup.style.display = 'none';
      } else {
        document.getElementById('btnRoleDonor').classList.add('active');
        document.getElementById('btnRolePatient').classList.remove('active');
        if (bgGroup) bgGroup.style.display = 'block';
      }
    }
  </script>
</body>
</html>
