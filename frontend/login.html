<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lifnex Platform</title>

  <link rel="stylesheet" href="static/css/variables.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/layout.css">
</head>
<body style="background: radial-gradient(circle at top right, rgba(254, 205, 211, 0.3), transparent 60%), var(--slate-100); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Demo Disclaimer Banner -->
  <div class="demo-banner">
    <div class="container flex justify-between items-center">
      <div class="demo-banner-text">
        <span class="demo-tag">Synthetic Demo Environment</span>
        <span>Simulated authentication — credentials are verified in frontend demonstration mode.</span>
      </div>
      <a href="index.html" class="text-xs text-cyan-200 hover:underline">&larr; Back to Home</a>
    </div>
  </div>

  <main class="flex items-center justify-center flex-1 p-6">
    <div class="card p-8" style="max-width: 440px; width: 100%; box-shadow: var(--shadow-xl);">
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center gap-2 mb-3">
          <img src="static/assets/logo/lifnex-logo.png" alt="Lifnex Logo" style="height: 38px; width: auto; margin: 0 auto;">
        </a>
        <h2 class="text-xl font-bold text-slate-900">Sign In to Lifnex</h2>
        <p class="text-xs text-slate-500 mt-1">Access your patient, donor, or hospital coordination portal</p>
      </div>

      <form id="loginForm">
        <!-- Demo Role Selector (Allows testing all 4 dashboard portals easily) -->
        <div class="form-group">
          <label for="demoRoleSelect" class="form-label">Select Demo Role to Preview</label>
          <select id="demoRoleSelect" class="form-select text-xs">
            <option value="patient">Patient Portal (Request Blood & Track)</option>
            <option value="donor">Voluntary Donor Hub (Receive & Respond)</option>
            <option value="hospital">Hospital Transfusion Center (Coordinate & Verify)</option>
            <option value="admin">Platform Administrator (Analytics & Governance)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" value="alex.donor@example.com" required>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center mb-1">
            <label for="loginPassword" class="form-label mb-0">Password <span class="required">*</span></label>
            <a href="forgot-password.html" class="text-xs text-crimson-600 hover:underline">Forgot Password?</a>
          </div>
          <div class="input-with-action">
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" value="demoPass123!" required>
            <button type="button" class="input-action-btn password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember demo session on this browser</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full py-2 mb-4">Sign In</button>

        <div class="text-center text-xs text-slate-500">
          Don't have an account yet? <a href="register.html" class="font-bold text-crimson-600 hover:underline">Register Now</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="static/js/main.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
